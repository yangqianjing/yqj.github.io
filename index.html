<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3em;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        nav {
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        nav a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #764ba2;
        }

        .posts {
            display: grid;
            gap: 30px;
        }

        .post-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .post-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .post-meta {
            color: #999;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .post-card h2 {
            color: #333;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .post-card h2 a {
            color: #333;
            text-decoration: none;
            transition: color 0.3s;
        }

        .post-card h2 a:hover {
            color: #667eea;
        }

        .post-excerpt {
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            text-decoration: none;
        }

        .read-more {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: transform 0.3s;
        }

        .read-more:hover {
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: white;
            margin-top: 60px;
        }

        footer a {
            color: white;
            text-decoration: none;
            border-bottom: 2px solid white;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2em;
            }
            
            nav {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }
            
            .post-card {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ 我的个人博客</h1>
            <p>记录学习 · 分享生活 · 探索世界</p>
        </header>

        <nav>
            <a href="index.html">首页</a>
            <a href="about.html">关于我</a>
            <a href="https://github.com/yangqianjing" target="_blank">GitHub</a>
        </nav>

        <div class="posts">
            <article class="post-card">
                <div class="post-meta">2026-06-07</div>
                <h2><a href="post-welcome.html">欢迎来到我的博客</a></h2>
                <p class="post-excerpt">
                    这是我的第一篇博客文章。我使用 GitHub Pages 搭建了这个博客，在这里我会分享我的学习笔记、技术文章和生活感悟。
                </p>
                <div class="tags">
                    <span class="tag">开始</span>
                    <span class="tag">博客</span>
                </div>
                <a href="post-welcome.html" class="read-more">阅读全文 →</a>
            </article>

            <article class="post-card">
                <div class="post-meta">2026-06-07</div>
                <h2><a href="post-markdown.html">如何使用 Markdown 写博客</a></h2>
                <p class="post-excerpt">
                    Markdown 是一种轻量级标记语言，非常适合写博客。本文介绍 Markdown 的基础语法和进阶技巧，帮助你快速上手。
                </p>
                <div class="tags">
                    <span class="tag">Markdown</span>
                    <span class="tag">教程</span>
                    <span class="tag">写作</span>
                </div>
                <a href="post-markdown.html" class="read-more">阅读全文 →</a>
            </article>
        </div>

        <footer>
            <p>© 2026 <a href="https://github.com/yangqianjing">yangqianjing</a> · 用 ❤️ 构建</p>
        </footer>
    </div>
</body>
</html>
