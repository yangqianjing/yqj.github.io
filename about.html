            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 20px;
        }

        .container {

        header {

        nav a {

        }

            border-radius: 15px;
            padding: 50px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);

        .content h2 {
            color: #667eea;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        .content p {
            margin-bottom: 15px;
            line-height: 1.8;
        }

        .content ul {
            margin-left: 30px;
            margin-bottom: 15px;
        }

        .content li {
            margin-bottom: 8px;
        }

        .content a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 2px solid #667eea;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: white;
            margin-top: 60px;
        }

        footer a {
            color: white;
            text-decoration: none;
            border-bottom: 2px solid white;
        }

</head>
