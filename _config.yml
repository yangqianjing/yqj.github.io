title: 我的个人博客
email: your-email@example.com
description: >-
  欢迎来到我的个人博客，这里记录我的学习与思考。
baseurl: ""
url: "https://yourusername.github.io"

# 社交账号
github_username: yourusername
# twitter_username: yourtwitter

# 构建设置
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 时区和语言
timezone: Asia/Shanghai
lang: zh-CN

# 分页
paginate: 10
paginate_path: "/page:num/"

# Markdown 处理器
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 排除文件
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
